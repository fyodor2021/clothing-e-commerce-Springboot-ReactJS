spring.application.name=api-gateway
server.port=8181
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.lease-renewal-interval-in-seconds=2

logging.level.org.springframework.cloud.gateway: DEBUG
logging.level.org.springframework.web: DEBUG
#gateway

##product Service
spring.cloud.gateway.routes[0].id=discovery-microservice
spring.cloud.gateway.routes[0].uri=http://localhost:8761
spring.cloud.gateway.routes[0].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[0].filters[0]=SetPath=/

##Discovery Service static route
spring.cloud.gateway.routes[1].id=discovery-microservice-static
spring.cloud.gateway.routes[1].uri=http://localhost:8761
spring.cloud.gateway.routes[1].predicates[0]=Path=/eureka/**

spring.cloud.gateway.routes[2].id=product-microservice
spring.cloud.gateway.routes[2].uri=http://localhost:3008
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/product/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

##Discovery Service
spring.cloud.gateway.routes[3].id=authentication-microservice
spring.cloud.gateway.routes[3].uri=http://localhost:8182
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[4].id=order-microservice
spring.cloud.gateway.routes[4].uri=http://localhost:3005
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter


