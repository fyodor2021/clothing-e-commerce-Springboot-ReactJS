spring.application.name=points-microservice
spring.datasource.url=jdbc:postgresql://host.docker.internal:5434/points-microservice
spring.datasource.username=root
spring.datasource.password=root
server.port=3005
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
eureka.client.enabled=true

eureka.client.serviceUrl.defaultZone=http://discovery-microservice:8761/eureka