    postgres-product:
      image: postgres:latest
      environment:
        POSTGRES_DB: product-microservice
        POSTGRES_USER : root
        POSTGRES_PASSWORD: root
      ports:
        - "5433:5432"
      restart: unless-stopped
      container_name: postgres-product
      volumes:
        - ./data/postgres/product-microservice:/data/postgres
        - ./init/postgres/product-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - spring




    postgres-order:
      image: postgres:latest
      environment:
        POSTGRES_DB: order-microservice
        POSTGRES_USER : root
        POSTGRES_PASSWORD: root
      ports:
        - "5434:5432"
      restart: unless-stopped
      container_name: postgres-order
      volumes:
        - ./data/postgres/order-microservice:/data/postgres
        - ./init/postgres/order-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - spring


    mongo-order:
      image: mongo
      environment:
        MONGO_INITDB_ROOT_USERNAME: root
        MONGO_INITDB_ROOT_PASSWORD: root
      ports:
        - "27019:27017"
      volumes:
        - ./data/mongo/order-microservice:/data/db
        - ./init/mongo/order-microservice/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      command: mongod --auth
      container_name: mongo-order
      restart: unless-stopped
      networks:
        - spring


    postgres-authentication:
      image: postgres:latest
      restart: unless-stopped
      container_name: postgres-authentication
      ports:
        - "5436:5432"
      environment:
        POSTGRES_DB: authentication-microservice
        POSTGRES_USER: root
        POSTGRES_PASSWORD: root
      volumes:
        - ./data/postgres/authentication-microservice:/data/postgres
        - ./init/postgres/authentication-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - spring

