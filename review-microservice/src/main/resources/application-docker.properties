spring.application.name=review-microservice

spring.datasource.url=jdbc:postgresql://host.docker.internal:5430/review-microservice
spring.datasource.username=root
spring.datasource.password=root
server.port=3001
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.serviceUrl.defaultZone=http://discovery-microservice:8761/eureka

user-microservice.url=http://user-microservice/api/user
product-microservice.url=http://product-microservice/api/product

management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

resilience4j.circuitbreaker.instances.review.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.review.event-consumer-buffer-size=10
resilience4j.circuitbreaker.instances.review.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.review.slidingWindowSize=5
resilience4j.circuitbreaker.instances.review.failureRateThreshold=1
resilience4j.circuitbreaker.instances.review.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.review.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.review.automaticTransitionFromOpenToHalfOpenEnabled=true
