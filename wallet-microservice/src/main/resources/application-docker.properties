spring.application.name=wallet-microservice

spring.datasource.url=jdbc:postgresql://host.docker.internal:5433/wallet-microservice
spring.datasource.username=root
spring.datasource.password=root
server.port=3004
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.serviceUrl.defaultZone=http://discovery-microservice:8761/eureka
eureka.client.enabled=true
