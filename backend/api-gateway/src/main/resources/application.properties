server.port=8181
spring.application.name=api-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

#gateway
##user Service
spring.cloud.gateway.routes[0].id=user-microservice
spring.cloud.gateway.routes[0].uri=lb://user-microservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/user/**
##product Service
spring.cloud.gateway.routes[1].id=product-microservice
spring.cloud.gateway.routes[1].uri=lb://product-microservice
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/product/**
spring.cloud.gateway.routes[1].filters[0]= AuthenticationFilter
##Discovery Service
spring.cloud.gateway.routes[2].id=discovery-service
spring.cloud.gateway.routes[2].uri=http://localhost:8761
#predicates defines conditions for routing , here all routing is based on path /api/discovery
spring.cloud.gateway.routes[2].predicates[0]=Path=/eureka/web
#SetPath = sets the path of the request before it is routed
spring.cloud.gateway.routes[2].filters[0]=SetPath=/

##Discovery Service static route
spring.cloud.gateway.routes[3].id=discovery-service-static
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/**

##review Service
spring.cloud.gateway.routes[4].id=review-microservice
spring.cloud.gateway.routes[4].uri=lb://review-microservice
#predicates defines conditions for routing , here all routing is based on path /api/review
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/review/**
spring.cloud.gateway.routes[4].filters[0]= AuthenticationFilter

##cart Service
spring.cloud.gateway.routes[5].id=cart-microservice
spring.cloud.gateway.routes[5].uri=lb://cart-microservice
#predicates defines conditions for routing , here all routing is based on path /api/auth
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/cart/**
spring.cloud.gateway.routes[5].filters[0]= AuthenticationFilter

spring.cloud.gateway.routes[6].id=authentication-microservice
spring.cloud.gateway.routes[6].uri=lb://authentication-microservice
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[6].filters[0]= AuthenticationFilter
