version: '3.8'

services:
  postgres-product:
    image: postgres:latest
    environment:
      POSTGRES_DB: product-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    restart: unless-stopped
    container_name: postgres-product
    volumes:
      - ./data/postgres/product-microservice:/data/postgres
      - ./init/postgres/product-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring

  postgres-user:
    image: postgres:latest
    environment:
      POSTGRES_DB: user-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5431:5432"
    restart: unless-stopped
    container_name: postgres-user
    volumes:
      - ./data/postgres/user-microservice:/data/postgres
      - ./init/postgres/user-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring
      
  postgres-review:
    image: postgres:latest
    environment:
      POSTGRES_DB: review-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5430:5432"
    restart: unless-stopped
    container_name: postgres-review
    volumes:
      - ./data/postgres/review-microservice:/data/postgres
      - ./init/postgres/review-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring


  postgres-wallet:
    image: postgres:latest
    environment:
      POSTGRES_DB: wallet-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    restart: unless-stopped
    container_name: postgres-wallet
    volumes:
      - ./data/postgres/wallet-microservice:/data/postgres
      - ./init/postgres/wallet-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring


  postgres-points:
    image: postgres:latest
    environment:
      POSTGRES_DB: points-microservice
      POSTGRES_USER : root
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    restart: unless-stopped
    container_name: postgres-points
    volumes:
      - ./data/postgres/points-microservice:/data/postgres
      - ./init/postgres/points-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring

  postgres-inventory:
    image: postgres:latest
    environment:
      POSTGRES_DB: inventory-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5435:5432"
    restart: unless-stopped
    volumes:
      - ./data/postgres/inventory-microservice:/data/postgres
      - ./init/postgres/inventory-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring


  mongo-cart:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo/cart-microservice:/data/db
      - ./init/mongo/cart-microservice/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: mongod --auth
    container_name: mongo-cart
    restart: unless-stopped
    networks:
      - spring

  mongo-express:
    image: mongo-express
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo-cart
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=root
      - ME_CONFIG_BASICAUTH_USERNAME=root
      - ME_CONFIG_BASICAUTH_PASSWORD=root
    depends_on:
      - mongo-cart
    container_name: mongo-express-cart
    ports:
      - "9500:8081"
    networks:
      - spring

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    container_name: redis-session
    networks:
      - spring

  postgres-authentication:
    image: postgres:latest
    container_name: postgres-authentication
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: authentication-microservice
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - ./data/postgres/authentication-microservice:/data/postgres
      - ./init/postgres/authentication-microservice/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring

  mongo-shift:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27018:27017"
    volumes:
      - ./data/mongo/shift-microservice:/data/db
      - ./init/mongo/shift-microservice/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: mongod --auth
    networks:
      - spring

  mongo-order:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27019:27017"
    volumes:
      - ./data/mongo/order-microservice:/data/db
      - ./init/mongo/order-microservice/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    command: mongod --auth
    networks:
      - spring

networks:
  spring:
    driver: bridge
