spring.application.name=cart-microservice

server.port = 3003
spring.data.mongodb.host=host.docker.internal
spring.data.mongodb.port=27017
spring.data.mongodb.database=cart-microservice

spring.data.mongodb.username=root
spring.data.mongodb.password=root
spring.data.mongodb.authentication-database=admin

eureka.client.serviceUrl.defaultZone=http://discovery-microservice:8761/eureka

logging.level.org.springframework.security=DEBUG
inventory.microservice.url=http://inventory-microservice/api/inventory
